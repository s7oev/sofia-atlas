---
layout: default
---
<main>
  <section
    class="page-head{% if page.page_head_class %} {{ page.page_head_class }}{% endif %}"
  >
    {% if page.eyebrow %}
      <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.lead %}
      <p class="lead">{{ page.lead }}</p>
    {% endif %}
  </section>

  {{ content }}
</main>
